# Self-hosting openmodels. A self-hosted instance is a full peer, not a degraded mode:
# it indexes from commaai/openpilot directly and depends on nothing we operate.
#
#   docker compose up -d                  # index + serve, no credentials needed
#   docker compose --profile web up -d    # ...also terminate TLS with caddy
#
# Detection is pure git (anonymous ls-remote + blobless fetch) and LFS blobs need no auth, so
# GITHUB_TOKEN is only ever required to *publish* — which is the public instance's job.

services:
  indexer:
    build: .
    command: ["/bin/sh", "-c", "while true; do python -m index.indexer --repo /data/openpilot --out /data/index.json || true; python web/render.py --index /data/index.json --out /data/public || true; sleep \"$${INTERVAL:-3600}\"; done"]
    environment:
      INTERVAL: "${INTERVAL:-3600}"
      BLOB_BACKEND: "${BLOB_BACKEND:-github}"
    volumes:
      - data:/data
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OPENMODELS_DATA: /data
      BLOB_BACKEND: "${BLOB_BACKEND:-github}"
      RELEASE_BASE: "${RELEASE_BASE:-https://github.com/OWNER/openmodels/releases/download/blobs}"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - data:/data
    restart: unless-stopped

  # Optional: most self-hosters already run traefik or nginx. Serves the static tree directly,
  # which is what keeps the site and downloads alive when the api container is down.
  caddy:
    image: caddy:2-alpine
    profiles: ["web"]
    command: ["caddy", "file-server", "--root", "/data/public", "--listen", ":80"]
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
