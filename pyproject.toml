[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmodels"
version = "0.1.0"
description = "Comma model archive directory and a dependency-free client SDK"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema"]
# index/ deliberately has no third-party deps: it must run on any CI runner.

[tool.setuptools]
packages = ["openmodels", "index"]

[tool.setuptools.package-data]
index = ["model_names.json", "model_hardware.json", "stock-supercombo.json"]
