name: Refresh archive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First run only: preserve archive state from gh-pages'
        type: boolean
        default: false

concurrency:
  group: archive-refresh
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      previous: ${{ steps.restore.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore durable checkpoint
        id: restore
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = true ]; then
            python -m ci.archive restore --bootstrap
          else
            python -m ci.archive restore
          fi
      - name: Clone upstream pointers
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/commaai/openpilot upstream
          git -C upstream fetch --prune --filter=blob:none origin '+refs/pull/*/head:refs/remotes/pr/*'
          git -C upstream fetch --prune --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Discover models
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_LIMIT: ${{ vars.METADATA_LIMIT || '20' }}
        run: |
          python -m index.indexer --repo upstream --head origin/master \
            --out data/index.json --previous data/index.json \
            --blob-cache "$RUNNER_TEMP/metadata" --metadata-source releases \
            --release-repo "$GITHUB_REPOSITORY" --download-limit "$METADATA_LIMIT"
          python -m index.registry --index data/index.json --out "$RUNNER_TEMP/validated"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discovered-archive
          path: data/index.json
          if-no-files-found: error
          retention-days: 7

  checkpoint-and-mirror:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.mirrored.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discovered-archive
          path: data
      - name: Save discoveries before any publishing work
        id: discovered
        env:
          PREVIOUS: ${{ needs.scan.outputs.previous }}
        run: python -m ci.archive checkpoint --revision "$PREVIOUS"
      - name: Mirror blobs on demand
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_LIMIT: ${{ vars.UPLOAD_LIMIT || '40' }}
        run: |
          python -m index.publish --index data/index.json --cache "$RUNNER_TEMP/blobs" \
            --repo "$GITHUB_REPOSITORY" --limit "$UPLOAD_LIMIT"
      - name: Save mirror locations
        id: mirrored
        env:
          PREVIOUS: ${{ steps.discovered.outputs.revision }}
        run: python -m ci.archive checkpoint --revision "$PREVIOUS"
      - name: Refresh summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('data/index.json'))
          print(f"Archive: {len(d['bundles'])} bundles, {len(d['files'])} artifacts")
          print(f"Mirrored: {d.get('mirrored_count', 0)}; pending retries: {len(d.get('mirror_failures', []))}")
          print(f"Upstream: {d['upstream_head']}; observed: {d['generated_at']}")
          PY

  publish:
    needs: checkpoint-and-mirror
    uses: ./.github/workflows/pages.yml
    with:
      archive_revision: ${{ needs.checkpoint-and-mirror.outputs.revision }}
    permissions:
      contents: write
      pages: write
      id-token: write
