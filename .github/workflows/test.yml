name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate workflow wiring
        if: matrix.python == '3.12'
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$RUNNER_TEMP/bin/actionlint"
      - name: Install test dependencies
        run: |
          python -m pip install '.[server,test]' numpy
          python -m pip install --no-deps ./runners/tinygrad
      - name: Validate contracts, archive, API and runner
        run: |
          python index/test_metadata.py
          python index/test_indexer.py
          python -m unittest discover -s tests -v
      - name: Build and test distributions
        if: matrix.python == '3.12'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist . ./runners/tinygrad
          python -m ci.wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python == '3.12'
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Install browser
        if: matrix.python == '3.12'
        run: |
          npm install --global agent-browser@0.27.0
          agent-browser install --with-deps
      - name: Verify Pages path and live composition
        if: matrix.python == '3.12'
        run: python -m ci.browser

  required:
    name: test
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix check
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
