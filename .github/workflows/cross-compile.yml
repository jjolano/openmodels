name: Experimental QCOM build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned runner and host compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static clang llvm
          python -m pip install . ./runners/tinygrad
      - name: Compile stock model and check host replay
        run: |
          python -m ci.cross_compile \
            --catalog https://jjolano.github.io/openmodels/catalog.json \
            --store "$RUNNER_TEMP/models" --out "$RUNNER_TEMP/qcom-build"
          echo 'Experimental a630 artifact: host replay passed; GPU parity and device timing are untested.' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/qcom-build/report.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-qcom-${{ github.sha }}
          path: ${{ runner.temp }}/qcom-build
          if-no-files-found: error
          retention-days: 14
